# Сборка Windows-версии на раннере GitHub: своя Windows-машина не нужна.
#
# Запуск вручную — вкладка Actions, кнопка «Run workflow». По тегу вида v1.2.3
# собранное дополнительно прикладывается к релизу.
#
# Готовые файлы лежат в артефактах прогона:
#   TunnelVPN-Portable.exe   портативная версия, один файл
#   TunnelVPN-setup.exe      установщик (служба, ярлыки, автозапуск)
#   SHA256SUMS.txt           контрольные суммы обоих exe

name: build

on:
  workflow_dispatch:
  push:
    branches: ["**"]     # тесты гоняем на каждый push, сборку — только по тегу
    tags: ["v*"]

permissions:
  contents: write        # нужно, чтобы приложить файлы к релизу по тегу

env:
  # Форк sing-box с поддержкой AmneziaWG — в основной сборке её нет.
  SINGBOX_VERSION: "1.14.2-lx.11"
  WINTUN_VERSION: "0.14.1"

jobs:
  # Чистая логика: разбор конфигов, границы прав, владение маршрутами.
  # Быстро и без Windows — поведение самой системы (каналы, PowerShell,
  # службы) так не проверить, для него нужна живая машина.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest tests -q

  windows:
    runs-on: windows-latest
    # Собираем только по тегу и по кнопке: обычный push проверяем тестами.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: tests

    steps:
      - uses: actions/checkout@v7

      # Та же версия, что $PyVersion в installer/build.ps1: с ней релиз и
      # уедет к пользователю.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Бинарники в репозитории не лежат: sing-box ~60 МБ, и у него своя
      # лицензия. Тянем их сюда — версии закреплены в env выше.
      - name: Скачать sing-box и wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path lib\bin | Out-Null

          $v = $env:SINGBOX_VERSION
          $url = "https://github.com/Leadaxe/sing-box-lx/releases/download/v$v/sing-box-$v-windows-amd64.zip"
          Write-Host "-> $url"
          Invoke-WebRequest $url -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          # В архиве всё лежит в подпапке с именем версии.
          Copy-Item (Get-ChildItem sb -Recurse -Filter sing-box.exe)[0].FullName lib\bin\

          $w = $env:WINTUN_VERSION
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$w.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item "wt\wintun\bin\amd64\wintun.dll" lib\bin\

          Get-ChildItem lib\bin

      # Закреплена: тёмный вид мастера (WizardStyle dark — с 6.6,
      # WizardBackColor — с 6.7.0). Старее tunnelvpn.iss не соберётся (#error),
      # новее — обновлять закрепление осознанно. 6.7.1 — последняя в Chocolatey;
      # 6.7.2–6.7.3 правили Wine и ISPP, нас это не касается.
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y

      # Подпись — только если в настройках репозитория заданы секреты
      # SIGN_PFX_BASE64 (.pfx в base64) и SIGN_PASSWORD. Без них сборка идёт
      # без подписи. build.ps1 берёт сертификат из хранилища по отпечатку:
      # пароль дальше этого шага не уходит.
      - name: Сертификат подписи
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host 'секрета SIGN_PFX_BASE64 нет — собираю без подписи'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            $pass = ConvertTo-SecureString $env:SIGN_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -Password $pass `
              -CertStoreLocation Cert:\CurrentUser\My
          } finally {
            Remove-Item $pfx -Force
          }
          "TVPN_SIGN_SHA1=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Сборка
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1

      # Хуки сбоев (build.ps1 -TestHooks, ISCC /DTESTHOOKS) — только для
      # проверки сбоев. build.ps1 сверяет то же у своего setup.exe; здесь —
      # у всего, что уйдёт в артефакты и релиз.
      - name: Без тестовых хуков
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem installer\Output\*.exe) {
            if ($f.Name -match 'testhooks' -or "$($f.VersionInfo.FileDescription)" -match 'TESTHOOKS') {
              throw "тестовая сборка в Output: $($f.Name)"
            }
          }

      - name: Портативная версия
        uses: actions/upload-artifact@v7
        with:
          name: TunnelVPN-Portable
          path: dist/TunnelVPN-Portable.exe
          if-no-files-found: error

      - name: Установщик
        uses: actions/upload-artifact@v7
        with:
          name: TunnelVPN-setup
          path: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
          if-no-files-found: error

      # Собранное без установки — на случай, если портативный exe не подойдёт
      # (антивирус, политика на однофайловые сборки).
      - name: Распакованная версия
        uses: actions/upload-artifact@v7
        with:
          name: TunnelVPN-dist
          path: dist/TunnelVPN/

      # Текст релиза — сообщение коммита тега: его показывает «Что нового» в
      # окне. С пустым телом API отдаёт пустую заметку, а releases.atom —
      # сообщение коммита с заголовком, разрезанным «…». bash, а не pwsh:
      # пишет байты UTF-8 как есть, кириллица не портится.
      - name: Текст релиза
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: git log -1 --format=%B > release-notes.md

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/TunnelVPN-Portable.exe
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
